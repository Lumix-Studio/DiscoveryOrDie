<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b13"/>
      <stop offset="60%" stop-color="#101c2a"/>
      <stop offset="100%" stop-color="#1a2b2c"/>
    </linearGradient>
    <linearGradient id="ground2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2a1c"/>
      <stop offset="100%" stop-color="#0b120a"/>
    </linearGradient>
    <linearGradient id="log" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4530"/>
      <stop offset="100%" stop-color="#2e2116"/>
    </linearGradient>
    <radialGradient id="moonGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dfeaff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#dfeaff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="clearingLight" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2c3d34" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2c3d34" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky2)"/>

  <circle cx="960" cy="150" r="180" fill="url(#moonGlow2)"/>
  <circle cx="960" cy="150" r="46" fill="#e9f1ff" opacity=".85"/>

  <g fill="#e8eefc">
    <circle cx="140" cy="100" r="1.4" opacity=".6"/>
    <circle cx="330" cy="60" r="1.2" opacity=".5"/>
    <circle cx="1560" cy="90" r="1.5" opacity=".6"/>
    <circle cx="1740" cy="140" r="1.2" opacity=".5"/>
    <circle cx="600" cy="50" r="1.3" opacity=".55"/>
    <circle cx="1300" cy="60" r="1.4" opacity=".55"/>
  </g>

  <!-- luz difusa central da clareira -->
  <ellipse cx="960" cy="560" rx="820" ry="420" fill="url(#clearingLight)"/>

  <!-- muro de árvores ao redor da clareira -->
  <g fill="#0a1712">
    <path d="M-40,1080 L-40,520 L40,420 L120,540 L200,400 L280,560 L360,430 L440,900 L-40,1080 Z"/>
    <path d="M1960,1080 L1960,500 L1880,410 L1800,540 L1720,400 L1640,560 L1560,420 L1480,900 L1960,1080 Z"/>
  </g>
  <g fill="#0d1f18">
    <path d="M0,750 L60,560 L140,680 L220,540 L300,660 L380,520 L460,680 L540,540 L620,700 L700,560 L800,720 L800,900 L0,900 Z"/>
    <path d="M1920,750 L1860,560 L1780,680 L1700,540 L1620,660 L1540,520 L1460,680 L1380,540 L1300,700 L1220,560 L1120,720 L1120,900 L1920,900 Z"/>
  </g>

  <!-- chão da clareira -->
  <path d="M0,760 Q480,690 960,715 T1920,750 L1920,1080 L0,1080 Z" fill="url(#ground2)"/>

  <!-- grama esparsa -->
  <g stroke="#3a4a2e" stroke-width="3" opacity=".55">
    <path d="M300,980 q6,-30 0,-50"/>
    <path d="M330,990 q8,-34 2,-56"/>
    <path d="M700,940 q6,-28 0,-46"/>
    <path d="M1250,970 q-6,-30 0,-50"/>
    <path d="M1500,930 q8,-30 0,-50"/>
    <path d="M1550,950 q-8,-26 -2,-44"/>
  </g>

  <!-- tronco caído no centro -->
  <g>
    <ellipse cx="1000" cy="860" rx="330" ry="30" fill="#050705" opacity=".5"/>
    <rect x="670" y="790" width="640" height="80" rx="38" fill="url(#log)"/>
    <ellipse cx="670" cy="830" rx="40" ry="40" fill="#3a2c1d"/>
    <ellipse cx="670" cy="830" rx="24" ry="24" fill="#241a11"/>
    <g stroke="#1e150d" stroke-width="3" opacity=".6">
      <line x1="740" y1="800" x2="760" y2="860"/>
      <line x1="860" y1="796" x2="880" y2="862"/>
      <line x1="980" y1="794" x2="1000" y2="864"/>
      <line x1="1100" y1="798" x2="1120" y2="862"/>
    </g>
  </g>

  <!-- névoa rasteira -->
  <ellipse cx="640" cy="920" rx="360" ry="46" fill="#d9e6ff" opacity=".08"/>
  <ellipse cx="1280" cy="950" rx="420" ry="50" fill="#d9e6ff" opacity=".07"/>
  <ellipse cx="960" cy="1000" rx="600" ry="60" fill="#d9e6ff" opacity=".06"/>

  <!-- vinhetagem sutil -->
  <rect width="1920" height="1080" fill="#000" opacity="0"/>
</svg>
