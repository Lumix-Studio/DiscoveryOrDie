<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 900">
  <defs>
    <linearGradient id="bohrCoat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a3040"/>
      <stop offset="55%" stop-color="#1c2130"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>
    <linearGradient id="bohrCoatShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161a24"/>
      <stop offset="100%" stop-color="#0e1119"/>
    </linearGradient>
    <linearGradient id="bohrSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8ad86"/>
      <stop offset="100%" stop-color="#c1976f"/>
    </linearGradient>
  </defs>

  <!-- sombra de contato -->
  <ellipse cx="250" cy="878" rx="95" ry="16" fill="#000" opacity=".35"/>

  <!-- pernas -->
  <path d="M205,610 L198,840 L172,840 L182,610 Z" fill="#20242f"/>
  <path d="M295,610 L318,840 L292,840 L282,610 Z" fill="#181c25"/>
  <!-- sapatos -->
  <path d="M164,840 L204,840 L210,864 L156,864 Z" fill="#0d0f14"/>
  <path d="M284,840 L324,840 L330,864 L276,864 Z" fill="#0d0f14"/>

  <!-- sobretudo (trench coat) -->
  <path d="M160,230 C140,260 118,340 120,430 L104,760 L400,760 L384,430
           C386,340 364,260 344,230 C320,205 290,195 250,195 C210,195 180,205 160,230 Z"
        fill="url(#bohrCoat)"/>
  <!-- painel de sombra lateral -->
  <path d="M290,230 C312,262 332,340 330,430 L344,760 L400,760 L384,430
           C386,340 364,260 344,230 C328,214 310,204 290,230 Z" fill="url(#bohrCoatShade)"/>
  <!-- fenda frontal do casaco -->
  <path d="M250,240 L238,755 L262,755 L250,240 Z" fill="#10131a" opacity=".7"/>
  <!-- cinto -->
  <rect x="150" y="470" width="200" height="18" fill="#0e1015"/>
  <circle cx="250" cy="479" r="7" fill="#3a2f1e"/>
  <!-- lapelas -->
  <path d="M212,205 L250,300 L222,240 Z" fill="#0f121a"/>
  <path d="M288,205 L250,300 L278,240 Z" fill="#0f121a"/>
  <!-- lenço/gravata dourada -->
  <path d="M238,225 L262,225 L254,320 L246,320 Z" fill="#d4a843"/>

  <!-- braços/mãos nos bolsos -->
  <path d="M118,420 C108,470 108,520 122,560 L160,555 C148,510 150,460 158,420 Z" fill="#1c2130"/>
  <path d="M382,420 C392,470 392,520 378,560 L340,555 C352,510 350,460 342,420 Z" fill="#161a24"/>
  <ellipse cx="128" cy="558" rx="16" ry="13" fill="url(#bohrSkin)"/>
  <ellipse cx="372" cy="558" rx="16" ry="13" fill="url(#bohrSkin)"/>

  <!-- pescoço -->
  <rect x="230" y="168" width="40" height="46" fill="url(#bohrSkin)"/>

  <!-- cabeça -->
  <ellipse cx="250" cy="128" rx="60" ry="66" fill="url(#bohrSkin)"/>
  <!-- orelhas -->
  <ellipse cx="192" cy="132" rx="9" ry="14" fill="#c1976f"/>
  <ellipse cx="308" cy="132" rx="9" ry="14" fill="#c1976f"/>

  <!-- sobrancelhas (levemente franzidas, olhar atento) -->
  <path d="M215,108 L242,114" stroke="#2b2016" stroke-width="6" stroke-linecap="round"/>
  <path d="M285,108 L258,114" stroke="#2b2016" stroke-width="6" stroke-linecap="round"/>
  <!-- olhos -->
  <circle cx="222" cy="126" r="5.5" fill="#1a140d"/>
  <circle cx="278" cy="126" r="5.5" fill="#1a140d"/>
  <!-- nariz -->
  <path d="M250,120 L244,150 L256,150 Z" fill="#c1976f"/>
  <!-- meio-sorriso sarcástico -->
  <path d="M226,164 Q250,176 276,160" stroke="#5c3d28" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- chapéu fedora -->
  <ellipse cx="250" cy="92" rx="98" ry="20" fill="#12151c"/>
  <path d="M182,92 C182,45 210,18 250,18 C290,18 318,45 318,92 C318,72 292,58 250,58 C208,58 182,72 182,92 Z" fill="#1a1e28"/>
  <rect x="182" y="82" width="136" height="14" fill="#d4a843"/>
</svg>
