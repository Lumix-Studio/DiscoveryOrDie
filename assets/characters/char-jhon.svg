<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 900">
  <defs>
    <linearGradient id="jhonJacket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a5230"/>
      <stop offset="55%" stop-color="#454020"/>
      <stop offset="100%" stop-color="#332f18"/>
    </linearGradient>
    <linearGradient id="jhonSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c98a5e"/>
      <stop offset="100%" stop-color="#b3754c"/>
    </linearGradient>
  </defs>

  <ellipse cx="250" cy="878" rx="98" ry="16" fill="#000" opacity=".35"/>

  <!-- pernas (calça cargo) -->
  <path d="M198,600 L188,838 L158,838 L176,600 Z" fill="#3c3a24"/>
  <path d="M302,600 L322,838 L292,838 L282,600 Z" fill="#302e1c"/>
  <!-- bolsos da calça -->
  <rect x="168" y="700" width="30" height="40" fill="#28271690" />
  <rect x="302" y="700" width="30" height="40" fill="#201f1290" />
  <!-- botas -->
  <path d="M150,838 L196,838 L204,866 L142,866 Z" fill="#181510"/>
  <path d="M284,838 L330,838 L338,866 L276,866 Z" fill="#181510"/>

  <!-- corpo/jaqueta -->
  <path d="M158,240 C136,270 122,330 126,410 L112,730 L388,730 L374,410
           C378,330 364,270 342,240 C316,210 284,198 250,198 C216,198 184,210 158,240 Z"
        fill="url(#jhonJacket)"/>
  <!-- zíper central -->
  <path d="M250,230 L246,725 L254,725 L250,230 Z" fill="#1e1c10" opacity=".8"/>
  <!-- bolsos peitorais -->
  <rect x="176" y="330" width="58" height="46" fill="#2c2a17" opacity=".85"/>
  <rect x="266" y="330" width="58" height="46" fill="#2c2a17" opacity=".85"/>
  <!-- cinto largo -->
  <rect x="140" y="470" width="220" height="20" fill="#211f12"/>

  <!-- braços -->
  <path d="M126,300 C104,360 100,430 118,490 L160,478 C148,420 150,360 160,300 Z" fill="#4a451f"/>
  <path d="M374,300 C396,360 400,430 382,490 L340,478 C352,420 350,360 340,300 Z" fill="#3a3618"/>
  <!-- mangas dobradas -->
  <rect x="120" y="455" width="46" height="24" rx="6" fill="#5a5230"/>
  <rect x="334" y="455" width="46" height="24" rx="6" fill="#4a4526"/>
  <!-- mãos -->
  <ellipse cx="138" cy="500" rx="17" ry="14" fill="url(#jhonSkin)"/>
  <ellipse cx="362" cy="500" rx="17" ry="14" fill="url(#jhonSkin)"/>

  <!-- alça da câmera -->
  <path d="M205,205 L250,420 L295,205" stroke="#1c1a10" stroke-width="10" fill="none"/>
  <!-- câmera fotográfica pendurada no peito -->
  <g transform="translate(250,430)">
    <rect x="-46" y="-30" width="92" height="62" rx="8" fill="#14141a"/>
    <rect x="-46" y="-44" width="34" height="16" rx="3" fill="#1c1c24"/>
    <circle cx="0" cy="0" r="26" fill="#0a0a0e"/>
    <circle cx="0" cy="0" r="18" fill="#2c3e52"/>
    <circle cx="-8" cy="-8" r="5" fill="#8fb8d8" opacity=".7"/>
    <circle cx="34" cy="-16" r="6" fill="#d4a843"/>
  </g>

  <!-- pescoço -->
  <rect x="228" y="170" width="44" height="42" fill="url(#jhonSkin)"/>

  <!-- cabeça -->
  <ellipse cx="250" cy="130" rx="62" ry="66" fill="url(#jhonSkin)"/>
  <ellipse cx="190" cy="134" rx="9" ry="14" fill="#b3754c"/>
  <ellipse cx="310" cy="134" rx="9" ry="14" fill="#b3754c"/>

  <!-- cabelo curto -->
  <path d="M190,100 C190,60 216,36 250,36 C284,36 310,60 310,100 C310,80 288,64 250,64
           C212,64 190,80 190,100 Z" fill="#2b1c10"/>
  <path d="M186,110 C182,96 186,78 198,66" stroke="#2b1c10" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- sobrancelhas retas, expressão confiante -->
  <path d="M212,112 L240,110" stroke="#2b1c10" stroke-width="6" stroke-linecap="round"/>
  <path d="M288,112 L260,110" stroke="#2b1c10" stroke-width="6" stroke-linecap="round"/>
  <circle cx="222" cy="128" r="5.5" fill="#1a1108"/>
  <circle cx="278" cy="128" r="5.5" fill="#1a1108"/>
  <path d="M250,122 L245,152 L257,152 Z" fill="#b3754c"/>
  <!-- sorriso largo e sincero -->
  <path d="M220,164 Q250,184 280,164" stroke="#5c3018" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
