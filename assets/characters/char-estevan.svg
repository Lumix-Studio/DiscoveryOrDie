<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 900">
  <defs>
    <linearGradient id="estCoat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c3f2a"/>
      <stop offset="55%" stop-color="#46301e"/>
      <stop offset="100%" stop-color="#332314"/>
    </linearGradient>
    <linearGradient id="estVest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4f30"/>
      <stop offset="100%" stop-color="#5c3a22"/>
    </linearGradient>
    <linearGradient id="estSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cf9d78"/>
      <stop offset="100%" stop-color="#b78561"/>
