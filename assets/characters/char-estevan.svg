  <path d="M296,610 L316,838 L290,838 L282,610 Z" fill="#241a10"/>
  <path d="M166,838 L206,838 L212,862 L158,862 Z" fill="#12100c"/>
  <path d="M282,838 L322,838 L328,862 L274,862 Z" fill="#12100c"/>

  <!-- casaco longo aberto -->
  <path d="M158,235 C136,270 122,340 126,430 L110,745 L200,745 L206,300 Z" fill="url(#estCoat)"/>
  <path d="M342,235 C364,270 378,340 374,430 L390,745 L300,745 L294,300 Z" fill="url(#estCoat)"/>

